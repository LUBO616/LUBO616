name: Generate contribution snake

on:
  # Update the animation automatically every day (UTC).
  schedule:
    - cron: '0 6 * * *'

  # Allow running it manually from the Actions tab.
  workflow_dispatch:

  # Generate it as soon as this file is committed to main.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Build and publish snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake (light and dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LUBO616
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
