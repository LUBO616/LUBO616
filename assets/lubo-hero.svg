<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="338" viewBox="0 0 1200 338" role="img" aria-labelledby="title desc">
  <title id="title">LUBO — Linux, Automation, Cybersecurity</title>
  <desc id="desc">Animated dark terminal banner with subtle neon highlights, scanning lines and status indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b14"/>
      <stop offset="0.5" stop-color="#0d1a2b"/>
      <stop offset="1" stop-color="#04191d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#55e6bd"/>
      <stop offset="1" stop-color="#58c4f6"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#0e9f88" stop-opacity=".29"/>
      <stop offset="1" stop-color="#0e9f88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#3a7c8c" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="338" rx="21"/></clipPath>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
    .cursor{animation:blink 1s steps(1,end) infinite}
    .scan{animation:scan 7s linear infinite}
    .spin{transform-origin:1006px 176px;animation:spin 24s linear infinite}
    .spin2{transform-origin:1006px 176px;animation:spin 35s linear reverse infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .pulse2{animation:pulse 2.4s ease-in-out .8s infinite}
    .bar{animation:appear 2.5s ease-in-out infinite alternate}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes scan{from{transform:translateY(-340px)}to{transform:translateY(350px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes appear{from{opacity:.2}to{opacity:.85}}
    @media (prefers-reduced-motion:reduce){.cursor,.scan,.spin,.spin2,.pulse,.pulse2,.bar{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="338" fill="url(#bg)"/>
    <rect width="1200" height="338" fill="url(#grid)"/>
    <ellipse cx="1010" cy="174" rx="390" ry="260" fill="url(#aura)"/>
    <rect x="1" y="1" width="1198" height="336" rx="20" fill="none" stroke="#2a5264" stroke-width="2"/>
    <rect x="0" y="0" width="1200" height="45" fill="#070e19" fill-opacity=".9"/>
    <path d="M0 45H1200" stroke="#2c5360" stroke-opacity=".7"/>
    <circle cx="28" cy="23" r="6" fill="#fa6472"/><circle cx="51" cy="23" r="6" fill="#f9c55b"/><circle cx="74" cy="23" r="6" fill="#62da8d"/>
    <text x="108" y="29" class="mono" font-size="15" fill="#8fa5bd">lubo@github:~ / profile.sh</text>
    <text x="1127" y="29" class="mono" font-size="12" fill="#55e6bd" text-anchor="end">● ONLINE</text>
    <g opacity=".88">
      <text x="64" y="93" class="mono" font-size="18" fill="#55e6bd">$ ./init-profile.sh</text>
      <text x="64" y="196" class="mono" font-weight="800" font-size="107" letter-spacing="12" fill="url(#accent)" filter="url(#glow)">LUBO</text>
      <rect x="420" y="145" width="13" height="60" rx="2" fill="#58c4f6" class="cursor"/>
      <text x="68" y="235" class="mono" font-size="20" fill="#dbe8f4">LINUX  /  AUTOMATION  /  CYBERSECURITY</text>
      <text x="68" y="267" class="mono" font-size="15" fill="#6c9daa">&gt; build()  &gt; break()  &gt; learn()  &gt; repeat()</text>
    </g>
    <g fill="none" stroke="#55e6bd" stroke-width="2">
      <circle class="spin" cx="1006" cy="176" r="100" stroke-dasharray="15 17" opacity=".37"/>
      <circle class="spin2" cx="1006" cy="176" r="78" stroke-dasharray="4 10" opacity=".6"/>
      <circle cx="1006" cy="176" r="57" opacity=".5"/>
      <path d="M954 176h104M1006 125v102" stroke="#58c4f6" stroke-opacity=".2"/>
    </g>
    <circle class="pulse" cx="1006" cy="176" r="34" fill="#0a302c" stroke="#55e6bd" stroke-width="2"/>
    <path d="M986 179l13 12 28-32" fill="none" stroke="#55e6bd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="922" cy="117" r="5" fill="#58c4f6" class="pulse2"/>
    <circle cx="1100" cy="211" r="4" fill="#55e6bd" class="pulse"/>
    <path d="M884 278h231" stroke="#3c7180" stroke-opacity=".65"/>
    <text x="1006" y="301" class="mono" font-size="13" fill="#97c4ce" text-anchor="middle">SYSTEMS · LABS · SECURITY</text>
    <rect x="0" y="0" width="1200" height="2" fill="#55e6bd" opacity=".4" class="bar"/>
    <rect class="scan" y="0" width="1200" height="3" fill="#55e6bd" opacity=".11"/>
    <path d="M23 314h85M23 314v-22M1177 314h-85M1177 314v-22" fill="none" stroke="#55e6bd" opacity=".44" stroke-width="2"/>
  </g>
</svg>
